name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Coverage gate (>= 70)
        run: pnpm cov

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation gate (score >= 70, incremental)
        run: pnpm mutation
      - name: Check incremental baseline is up to date
        run: git diff --exit-code stryker-incremental.json || (echo "::error::stryker-incremental.json 有变化，请本地跑 pnpm mutation 后提交更新基线" && exit 1)
