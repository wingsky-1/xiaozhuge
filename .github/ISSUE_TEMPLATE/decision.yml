name: 决策（Decision）
description: 红线事项的架构决策——API/协议变更、新依赖、CI/workflow 变更、安全语义
title: "[decision] "
labels: ["zone/red-line"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 为什么必须做；不做会怎样。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的替代路径与被否理由。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 触碰的公共 API / 协议不变量 / 依赖图 / 安全模型。
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 回滚方式
      description: 出问题怎么退回来。
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        > 维护者批准后在 issue 上打 `state/approved` label；Agent 以此为动工凭据，PR 必须链接本 issue。
