# 变异测试基线归档（issue #62 建立的机制；issue #101 P4 段式化改造）：
# PR 侧做增量跑 + 聚合分数门禁，不再要求人工提交基线。
# ⚠ push 自动归档已关闭（维护者指示，2026-08-26）：GITHUB_TOKEN 创建的快照
# PR 自 GitHub 2026-06 平台策略起其 CI 需人工批准，自动链路反复卡死、产出
# 过期基线反受其害。当前仅保留 workflow_dispatch 手动兜底入口；待 P1（PAT）
# 落地后以段式自动归档形态重建。
name: Baseline

on:
  workflow_dispatch:

concurrency:
  group: baseline-dispatch

# 开基线快照 PR 需要 push 分支（contents）与建 PR（pull-requests）写权限，
# 最小权限原则下放到 job 级（issue #101 P5）。

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 全量跑 = 顺序执行 stryker.conf.d/ 全部段并聚合判分（scripts/mutation-all.mjs）
      - name: Mutation full run (aggregate score >= 70)
        run: pnpm mutation
      # 规范化基线（剥运行期噪声、稳定键序）——快照 PR 的 diff 只含真实身份变化；
      # 否则全量重跑的 status/location 漂移会让每次都产生假 diff。
      - name: Normalize segment baselines
        run: node scripts/check-mutation-baseline.mjs --normalize
      # 语义门控：与 HEAD 基线做身份集合比较，无实质差异则跳过快照 PR。
      # 复用校验脚本的退出码约定：1 = 存在内容级差异（此处即「需要快照」）。
      - name: Semantic diff gate
        id: semantic
        run: |
          if node scripts/check-mutation-baseline.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "基线无实质变化，跳过快照"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变异体集合变化，进入快照"
          fi
      - name: Open baseline snapshot PR if changed
        id: snapshot
        if: steps.semantic.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/mutation-baseline
          title: "chore: mutation baseline snapshot (segmented)"
          body: |
            自动归档：全量变异后的段式增量基线快照（issue #62 / #101 P4）。
          commit-message: "chore: refresh stryker segmented incremental baselines"
          add-paths: stryker-incremental-*.json
          labels: chore
      - name: Auto-merge baseline PR (best effort, manual fallback)
        if: steps.snapshot.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.snapshot.outputs.pull-request-number }}" \
            || echo "::warning::baseline PR 自动合并失败，请人工处理"
