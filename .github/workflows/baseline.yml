# 变异测试基线全量刷新（#608 工业级孤立分支沉淀）：
# 定时全量重跑变异并直接强推到独立孤立分支 refs/heads/baseline/mutation（深度恒为 1），
# 彻底废除向 main 分支自动建 PR（杜绝主分支代码树膨胀、机器人 PR 噪音与 BASELINE_PAT 依赖）。
# PR 门禁阶段仅需浅拉取孤立分支做增量跑 + 聚合分数门禁。
name: Baseline

on:
  # 降频触发（维护者指示）：每日北京时间 09:00（UTC 01:00）一次。
  # 权衡留痕：基线新鲜度按天计足够——过期代价只是 PR 重测面扩大少许（慢）而非
  # 正确性问题；手动 dispatch 兜底保留。
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: baseline-scheduled
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 预先浅拉取孤立分支现存基线（作为增量执行与语义对比基准）
      - name: Restore orphan branch baseline
        run: node scripts/orphan-baseline.mjs restore
      # 全量跑 = 顺序执行 stryker.conf.d/ 全部段并聚合判分（scripts/mutation-all.mjs）
      - name: Mutation full run (aggregate score >= 70)
        run: pnpm mutation
      # 规范化基线（剥运行期噪声、稳定键序）——使 diff 仅反映真实变异体身份变化
      - name: Normalize segment baselines
        run: node scripts/check-mutation-baseline.mjs --normalize
      # 语义门控：与孤立分支当前基线做身份集合比较，无实质差异则跳过快照推送。
      # 复用校验脚本的退出码约定：1 = 存在内容级差异（此处即「需要快照」）。
      - name: Semantic diff gate
        id: semantic
        run: |
          if node scripts/check-mutation-baseline.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "基线无实质变化，跳过孤立分支快照"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变异体集合变化，准备推送孤立分支"
          fi
      # 强推至独立孤立分支（仅使用 Actions 默认 GITHUB_TOKEN，彻底摆脱 BASELINE_PAT 与机器人 PR）
      - name: Push baseline snapshot to orphan branch
        if: steps.semantic.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/orphan-baseline.mjs push
