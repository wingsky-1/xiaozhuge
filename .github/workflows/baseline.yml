# 变异测试基线归档（issue #62 建立机制；#101 P4 段式化；P1 恢复自动归档）：
# main 合入变异面相关代码后全量重跑变异并快照段式基线，PR 侧只做增量跑 +
# 聚合分数门禁。防循环：本 workflow 只改基线文件时被 paths-ignore 过滤。
#
# 为什么用 PAT 而非 GITHUB_TOKEN（issue #101 P1 实证）：GitHub 2026-06-11
# 平台策略起，GITHUB_TOKEN 创建的 PR 其 CI run 需人工批准（action_required），
# 自动归档链路反复卡死产出过期基线；PAT（secrets.BASELINE_PAT，细粒度、限本仓
# contents+pull-requests）创建的快照 PR 以真人身份触发 CI 并自动放行。
# ⚠ PAT 到期会静默断链——表现为快照 PR 再次卡 action_required，届时换发
# token 更新 secret 即可（fail-visible）。
name: Baseline

on:
  push:
    branches: [main]
    paths-ignore:
      - "stryker-incremental-*.json"
  workflow_dispatch:

concurrency:
  group: baseline-${{ github.event_name }}
  # 连续合入时新触发取代旧全量跑；手动 dispatch 完整执行
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # 变更面检测：mutate 面未变的合入（docs-only 等）不可能改变 mutant 结果，
  # 跳过全量归档。触发集与 ci.yml changes job 保持同一份变异面口径
  # （src/tests/prompts/stryker 配置/lockfile/tsconfig），另加归档链路自身：
  # check-mutation-baseline.mjs（normalize/语义 diff 逻辑）与本 workflow。
  # fail-safe 口径与 ci.yml 一致：diff 基线不可得即执行。
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute changed files vs previous main
        id: filter
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base"..."$(git rev-parse HEAD)" | grep -qE '^(src/|tests/|prompts/|stryker\.conf\.d/|package\.json$|pnpm-lock\.yaml$|tsconfig.*\.json$|scripts/check-mutation-baseline\.mjs$|\.github/workflows/baseline\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "变异面无变化，跳过全量归档"
          fi

  archive:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 全量跑 = 顺序执行 stryker.conf.d/ 全部段并聚合判分（scripts/mutation-all.mjs）
      - name: Mutation full run (aggregate score >= 70)
        run: pnpm mutation
      # 规范化基线（剥运行期噪声、稳定键序）——快照 PR 的 diff 只含真实身份变化；
      # 否则全量重跑的 status/location 漂移会让每次都产生假 diff。
      - name: Normalize segment baselines
        run: node scripts/check-mutation-baseline.mjs --normalize
      # 语义门控：与 HEAD 基线做身份集合比较，无实质差异则跳过快照 PR。
      # 复用校验脚本的退出码约定：1 = 存在内容级差异（此处即「需要快照」）。
      - name: Semantic diff gate
        id: semantic
        run: |
          if node scripts/check-mutation-baseline.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "基线无实质变化，跳过快照"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变异体集合变化，进入快照"
          fi
      - name: Open baseline snapshot PR if changed
        id: snapshot
        if: steps.semantic.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # PAT 身份：使快照 PR 的 CI 自动放行（GITHUB_TOKEN 会卡 action_required）
          token: ${{ secrets.BASELINE_PAT }}
          branch: chore/mutation-baseline
          title: "chore: mutation baseline snapshot (segmented)"
          body: |
            自动归档：main 全量变异后的段式增量基线快照（issue #62 / #101 P1）。
            合入后由 `paths-ignore` 防止再次触发全量跑。
          commit-message: "chore: refresh stryker segmented incremental baselines"
          add-paths: stryker-incremental-*.json
          labels: chore
      # merge 同样走 PAT：GITHUB_TOKEN 触发的 push 不产生 workflow run（防递归
      # 机制），会导致「快照合入后的 main」从未被 CI 验证过；PAT 身份则正常触发。
      - name: Auto-merge baseline PR
        if: steps.snapshot.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.BASELINE_PAT }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.snapshot.outputs.pull-request-number }}"
