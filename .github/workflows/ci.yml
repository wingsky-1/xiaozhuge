name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A/B 入口（issue #101 P3）：手动指定 stryker concurrency 做 runner 实测对照，
  # 判据见 issue——killed 绝对数不减且 error 计数不增，timedOut 集合无新增
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Stryker concurrency（默认 4 = runner 现状）"
        required: false
        default: "4"
        type: string

# 最小权限声明（issue #101 P5）：CI 只需读源码
permissions:
  contents: read

# PR 连推取消旧跑；main push 同理（门禁以各 PR run 为准，push run 是冗余验证）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 变动段路由（issue #115）：三档——skip（无关变更）/ partial（仅 src 命中段）/
  # full（tests/prompts/配置/lockfile 变更或 fail-safe）。判定逻辑收在
  # scripts/mutation-segments.mjs（单一事实源，本地可调试），CI 只传文件清单。
  changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      segments: ${{ steps.route.outputs.segments }}
      segments_csv: ${{ steps.route.outputs.segments_csv }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pull_request 默认检出动态 merge ref（= 当前 base 最新 + head），
          # 与静态 base.sha 不同步时 diff 会混入 base 分支的新进展（#119 实证：
          # main 前进引入 tests/** 变更导致误判 full）。显式检出 head.sha 使
          # diff 只反映 PR 自身变更。push/其它事件下该表达式为空 → 用默认 ref。
          ref: ${{ github.event.pull_request && github.event.pull_request.head.sha || '' }}
      - name: Compute changed files vs base
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --name-only "$base"..."$(git rev-parse HEAD)" > /tmp/changed-files.txt
            echo "diff_ok=true" >> "$GITHUB_OUTPUT"
          else
            # 新分支首次 push 无 before 基线：fail-safe 走全量
            echo "diff_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Route mutation segments
        id: route
        run: |
          if [ "${{ steps.diff.outputs.diff_ok }}" = "true" ]; then
            node scripts/mutation-segments.mjs /tmp/changed-files.txt > /tmp/route.json
          else
            node scripts/mutation-segments.mjs --all > /tmp/route.json
          fi
          echo "mode=$(node -p "require('/tmp/route.json').mode")" >> "$GITHUB_OUTPUT"
          echo "segments=$(node -p "JSON.stringify(require('/tmp/route.json').segments)")" >> "$GITHUB_OUTPUT"
          echo "segments_csv=$(node -p "require('/tmp/route.json').segments.join(',')")" >> "$GITHUB_OUTPUT"

  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # fetch 全量历史与分支 refs：diff-cover 需要 origin/main 作 diff 基线
        with:
          fetch-depth: 0
      # 零依赖静态校验，置于 install 前以快速失败
      - name: ADR registry check (unique numbering, filename/title consistency)
        run: node scripts/check-adr-registry.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint 与 typecheck 相互独立（只读源码），并行执行压缩 gauntlet 串行等待；
      # wait 确保任一失败都以非零退出整体步骤红（shell -e 下后台任务失败不
      # 自动传播，必须显式 wait 检查退出码）。
      - name: Static checks (lint + typecheck in parallel)
        run: |
          pnpm lint &
          pnpm typecheck &
          wait
      - run: pnpm build
      - run: pnpm test
      - name: Coverage gate (>= 70)
        run: pnpm cov
      # 增量门禁（#30）：本次 PR 变更行覆盖率 >= 80%；自托管 diff-cover，数据不出仓库。
      # diff-cover 版本 pin 于 requirements-ci.txt：消除每次安装最新版的漂移风险，
      # 并使 setup-python 的 pip cache 可用（依赖清单即缓存键）
      - name: Patch coverage gate (changed lines >= 80%)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install --disable-pip-version-check -r requirements-ci.txt
      - run: pnpm cov:patch

  # 动态段式变异矩阵（issue #115）：matrix 段清单由 changes 路由输出
  # fromJson 实例化——仅 src 变更时只跑命中段，tests/配置变更时全段。
  mutation:
    needs: changes
    if: needs.changes.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    strategy:
      # 段间互不遮蔽：一段红其余段继续跑完，聚合门禁一次性给出完整判分
      fail-fast: false
      matrix:
        seg: ${{ fromJson(needs.changes.outputs.segments) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 构建产物依赖：client 契约测试读 dist/client.js，双进程 CAS 测试解析
      # dist/runtime/kernel/cas-lock.js——沙箱无产物则 dry run 必挂。
      - run: pnpm build
      # 增量门禁（issue #62）：只回答「本次改动是否打穿既有断言」；段级基线
      # stryker-incremental-<seg>.json 随仓库维护。thresholds.break=0——分数
      # 判定统一由 mutation-gate 聚合承担（plugin 段 total 口径 65.68，
      # 独立 break 会假红，见 scripts/mutation-gate.mjs 头注）。
      - name: Mutation segment gate (${{ matrix.seg }})
        # CI 裁剪 html/progress reporter（issue #101 P5）：html 纯写盘无消费者，
        # progress 刷屏；clear-text 供判分读数、json 供聚合门禁。
        # concurrency 仅 workflow_dispatch 可覆盖（P3 A/B 入口），push/PR 恒用默认
        run: pnpm exec stryker run "stryker.conf.d/${{ matrix.seg }}.json" --reporters clear-text,json --concurrency "${{ inputs.concurrency || 4 }}"
      - name: Upload segment report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.seg }}
          path: reports/mutation/${{ matrix.seg }}.json
          if-no-files-found: error

  # 聚合判分层（issue #101 P4 + #115 合成口径）：covered 口径跨段聚合 vs 阈值，
  # fail-closed——缺任一实跑段报告即红；partial 形态未跑段从入库基线反推合成。
  # needs 失败默认跳过本 job 会漏掉「矩阵某段崩溃」，故用 if: always() 显式检查。
  mutation-gate:
    needs: [changes, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 路由判定无关变更（docs-only 等）直接放行
      - name: Skip (route mode=skip)
        if: needs.changes.outputs.mode == 'skip'
        run: echo "无变异面变更，变异门禁按路由口径跳过"
      # 矩阵存在失败/取消段时红掉（fail-fast: false 下其余段已跑完，不遮蔽）
      - name: Fail on matrix failure
        if: needs.changes.outputs.mode != 'skip' && needs.mutation.result != 'success'
        run: |
          echo "::error::mutation 矩阵存在失败段（result=${{ needs.mutation.result }}）"
          exit 1
      - uses: actions/checkout@v4
        if: needs.changes.outputs.mode != 'skip' && needs.mutation.result == 'success'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.mode != 'skip' && needs.mutation.result == 'success'
        with:
          pattern: mutation-report-*
          path: reports/mutation
          merge-multiple: true
      - name: Aggregate covered score gate (>= 70)
        if: needs.changes.outputs.mode != 'skip' && needs.mutation.result == 'success'
        run: node scripts/mutation-gate.mjs --ran "${{ needs.changes.outputs.segments_csv }}"