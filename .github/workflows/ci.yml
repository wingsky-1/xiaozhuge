name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A/B 入口（issue #101 P3）：手动指定 stryker concurrency 做 runner 实测对照，
  # 判据见 issue——killed 绝对数不减且 error 计数不增，timedOut 集合无新增
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Stryker concurrency（默认 4 = runner 现状）"
        required: false
        default: "4"
        type: string

# 最小权限声明（issue #101 P5）：CI 只需读源码
permissions:
  contents: read

# PR 连推取消旧跑；main push 同理（门禁以各 PR run 为准，push run 是冗余验证）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 变更面检测（issue #101 P2）：mutation 只回答「源码/测试/运行时数据是否被改动」，
  # docs-only 变更不可能改变任何 mutant 结果，跳过以省 ~163s 固定成本。
  # 触发集依据：mutate 面 src/**/*.ts；tests/** 改变 killed 集合；
  # prompts/** 被 src/runtime/template-loader.ts 运行时读入（参与行为，缺失即抛）。
  # fail-safe：无法取得 diff 基线（新分支 push 等）时一律视为需要跑。
  changes:
    runs-on: ubuntu-latest
    outputs:
      mutation: ${{ steps.filter.outputs.mutation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute changed files vs base
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "mutation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base"..."$(git rev-parse HEAD)" > /tmp/changed-files.txt
          if grep -qE '^(src/|tests/|prompts/|stryker\.conf\.json$|package\.json$|pnpm-lock\.yaml$|tsconfig.*\.json$|\.github/workflows/ci\.yml$)' /tmp/changed-files.txt; then
            echo "mutation=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutation=false" >> "$GITHUB_OUTPUT"
          fi

  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # fetch 全量历史与分支 refs：diff-cover 需要 origin/main 作 diff 基线
        with:
          fetch-depth: 0
      # 零依赖静态校验，置于 install 前以快速失败
      - name: ADR registry check (unique numbering, filename/title consistency)
        run: node scripts/check-adr-registry.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Coverage gate (>= 70)
        run: pnpm cov
      # 增量门禁（#30）：本次 PR 变更行覆盖率 >= 80%；自托管 diff-cover，数据不出仓库。
      # diff-cover 版本 pin 于 requirements-ci.txt：消除每次安装最新版的漂移风险，
      # 并使 setup-python 的 pip cache 可用（依赖清单即缓存键）
      - name: Patch coverage gate (changed lines >= 80%)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install --disable-pip-version-check -r requirements-ci.txt
      - run: pnpm cov:patch

  mutation:
    needs: changes
    # docs-only 变更跳过（issue #101 P2）；判定逻辑见 changes job 注释
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 构建产物依赖：client 契约测试读 dist/client.js，双进程 CAS 测试解析
      # dist/runtime/kernel/cas-lock.js——沙箱无产物则 dry run 必挂。
      - run: pnpm build
      # 增量门禁（issue #62）：只回答「本次改动是否打穿既有断言」；基线新鲜度由
      # baseline.yml 在 main 合入后全量归档负责，PR 不再校验、不再人工提交基线。
      - name: Mutation gate (score >= 70, incremental)
        # CI 裁剪 html/progress reporter（issue #101 P5）：html 纯写盘无消费者，
        # progress 刷屏；clear-text 供判分读数、json 供事后分析。
        # concurrency 仅 workflow_dispatch 可覆盖（P3 A/B 入口），push/PR 恒用默认
        run: pnpm mutation --reporters clear-text,json --concurrency "${{ inputs.concurrency || 4 }}"
